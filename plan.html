<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan &amp; Paket - UBot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loverlay"><div class="lspin"></div></div>
<div id="toast-c"></div>

<div class="moverlay" id="mdPay">
  <div class="mbox">
    <div class="mic blue"><i class="fa-solid fa-credit-card"></i></div>
    <div class="mtitle" id="payTitle">Upgrade Plan</div>
    <div class="mdesc"  id="payDesc">Lanjutkan ke pembayaran via Pakasir</div>
    <div class="mactions">
      <button class="mbtn prim" onclick="proceedPay()"><i class="fa-solid fa-arrow-right"></i> Lanjut Bayar</button>
      <button class="mbtn outl" onclick="closeM('mdPay')">Batal</button>
    </div>
  </div>
</div>

<div style="min-height:100vh;display:flex;flex-direction:column">
  <header class="page-header">
    <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="hdr-plain">Paket &amp; Plan</div>
    <div style="width:36px"></div>
  </header>
  <div style="flex:1;overflow-y:auto;padding-bottom:24px">
    <div class="plan-hero">
      <div class="plan-hero-ic"><i class="fa-solid fa-crown"></i></div>
      <div class="plan-hero-t">Pilih Paket UBot</div>
      <div class="plan-hero-s">Upgrade untuk fitur lebih banyak &amp; performa terbaik</div>
    </div>
    <div class="plan-list" id="planList"></div>
  </div>
</div>

<script src="config.js"></script>
<script>

const API = window.UBOT_CONFIG.API_URL;
async function apiFetch(path,body=null,method=null){
  const opts={credentials:'include',headers:{'Content-Type':'application/json'}};
  opts.method=body?(method||'POST'):(method||'GET');
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  const d=await r.json();
  if(!r.ok)throw Object.assign(new Error(d.error||'Error'),{data:d});
  return d;
}
async function checkAuth(){
  try{const d=await apiFetch('/api/auth/status');if(!d.loggedIn){window.location.replace('connect.html');return false;}return true;}
  catch(e){window.location.replace('connect.html');return false;}
}
function el(id){return document.getElementById(id);}
function closeM(id){el(id)?.classList.remove('show');}
function toast(msg,color,icon){
  color=color||'var(--blue-l)';icon=icon||'fa-solid fa-info-circle';
  const c=el('toast-c');if(!c)return;
  const t=document.createElement('div');
  t.className='toast';t.style.borderColor=color;
  t.innerHTML='<i class="'+icon+'" style="color:'+color+'"></i>'+msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2800);
}

const PLANS={
  free:{name:'Free',price:0,features:76,desc:'Fitur dasar untuk pemula',cls:'f',
    perks:[{ok:true,t:'1 Instance UBot'},{ok:true,t:'Commands Terbatas'},{ok:true,t:'Storage Terbatas'},
           {ok:true,t:'Notifikasi Dasar'},{ok:true,t:'Akses Terminal'},{ok:true,t:'Support Telegram'},
           {ok:false,t:'Uptime 24/7'},{ok:false,t:'Commands Unlimited'},{ok:false,t:'Storage 1GB'}]},
  pro:{name:'Pro',price:1000,features:79,desc:'Untuk kebutuhan harian',cls:'p',
    perks:[{ok:true,t:'1 Instance UBot'},{ok:true,t:'Uptime 24/7'},{ok:true,t:'Commands Unlimited'},
           {ok:true,t:'Storage 1GB'},{ok:true,t:'Full Features Pro (79 fitur)'},{ok:true,t:'Priority Support'},
           {ok:false,t:'3 Instance UBot'},{ok:false,t:'Storage 2GB'}]},
  max:{name:'MAX',price:5000,features:83,desc:'Semua fitur tanpa batas',cls:'m',
    perks:[{ok:true,t:'3 Instance UBot'},{ok:true,t:'Uptime Unlimited'},{ok:true,t:'Commands Unlimited'},
           {ok:true,t:'Storage 2GB'},{ok:true,t:'Full Features MAX (83 fitur)'},{ok:true,t:'VIP Support'},
           {ok:true,t:'Akses Fitur Eksklusif'},{ok:true,t:'Semua update terbaru'}]}
};
let curPlan='free',selPlan=null;

async function loadPlan(){
  try{if(!await checkAuth())return;const d=await apiFetch('/api/plan');curPlan=d.plan||'free';}catch(_){}
  renderPlans();
  el('loverlay').classList.add('hidden');
  const p=new URLSearchParams(location.search);
  if(p.get('upgraded')){
    try{
      await apiFetch('/api/plan/confirm',{plan:p.get('upgraded')});
      curPlan=p.get('upgraded');renderPlans();
      toast('Plan diupgrade ke '+curPlan.toUpperCase()+'!','var(--green)','fa-solid fa-crown');
    }catch(_){}
    history.replaceState({},'','plan.html');
  }
}

function renderPlans(){
  const list=el('planList');
  list.innerHTML=Object.entries(PLANS).map(([key,p])=>{
    const cur=key===curPlan;
    let cc='plan-card '+key;if(cur)cc+=' current';
    const ph=p.price===0
      ?'<div class="plan-price fp">Gratis</div><div class="plan-period">selamanya</div>'
      :'<div class="plan-price">Rp '+p.price.toLocaleString('id-ID')+'</div><div class="plan-period">/ bulan</div>';
    const feats='<ul class="plan-feats">'+p.perks.map(f=>
      '<li><i class="fa-solid '+(f.ok?'fa-check ok':'fa-xmark no')+'"></i><span'+(f.ok?'':' style="color:var(--text3);text-decoration:line-through"')+'>'+f.t+'</span></li>'
    ).join('')+'</ul>';
    let btn;
    if(cur)btn='<div class="plan-cur-btn"><i class="fa-solid fa-check"></i> Plan Aktif</div>';
    else if(key==='free')btn='<div class="plan-cur-btn" style="background:rgba(100,116,139,.06);border-color:var(--border);color:var(--text3)">Plan Dasar</div>';
    else btn='<button class="plan-up-btn '+(key==='max'?'mbtn':'pbtn')+'" onclick="selectPlan(''+key+'')"><i class="fa-solid fa-crown"></i> Upgrade ke '+p.name+'</button>';
    return '<div class="'+cc+'"><div class="plan-top"><div>'+(cur?'<div class="plan-tag-act">Aktif</div>':'')+'<div class="plan-name '+p.cls+'">'+p.name+'</div><div style="font-size:11px;color:var(--text3);margin-top:2px">'+p.desc+'</div></div><div style="text-align:right">'+ph+'</div></div><div style="font-size:12px;color:var(--text2);margin-bottom:8px"><i class="fa-solid fa-puzzle-piece" style="color:var(--blue-l)"></i> <strong>'+p.features+'</strong> fitur</div>'+feats+btn+'</div>';
  }).join('');
}

function selectPlan(plan){
  selPlan=plan;const p=PLANS[plan];
  el('payTitle').textContent='Upgrade ke '+p.name;
  el('payDesc').textContent='Rp '+p.price.toLocaleString('id-ID')+'/bln via Pakasir (bot-worm-ai) - '+p.features+' fitur aktif';
  el('mdPay').classList.add('show');
}

async function proceedPay(){
  if(!selPlan)return;closeM('mdPay');
  try{
    const d=await apiFetch('/api/plan/upgrade',{plan:selPlan});
    if(d.paymentUrl){window.open(d.paymentUrl,'_blank');toast('Membuka pembayaran Pakasir...','var(--blue-l)','fa-solid fa-credit-card');}
    else if(d.demo){
      if(confirm('Pakasir tidak tersedia saat ini.\nKonfirmasi manual upgrade ke '+selPlan.toUpperCase()+'?')){
        await apiFetch('/api/plan/confirm',{plan:selPlan});
        curPlan=selPlan;renderPlans();
        toast('Diupgrade ke '+PLANS[selPlan].name+'!','var(--green)','fa-solid fa-crown');
      }
    }
  }catch(e){toast('Gagal upgrade: '+e.message,'var(--red)','fa-solid fa-xmark');}
}
loadPlan();
</script>
</body></html>
